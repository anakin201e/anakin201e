<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Copy Text</title>
<style>
  body {
    font-family: sans-serif;
    padding: 20px;
  }
  button {
    padding: 12px 20px;
    font-size: 18px;
    cursor: pointer;
  }
  #status {
    margin-top: 15px;
    color: #555;
  }
</style>
</head>
<body>

<h2>テキストコピー</h2>
<button onclick="copyText()">このテキストをコピー</button>
<div id="status">待機中</div>

<script>
async function copyText() {
  const url = "https://drive.google.com/uc?export=download&id=XXXXXXXXXXXX"; // ←★ここだけ差し替え

  document.getElementById("status").innerText = "読み込み中…（数秒かかる場合があります）";

  try {
    const response = await fetch(url);
    const text = await response.text(); // 大容量対応 fetch
    await navigator.clipboard.writeText(text);
    document.getElementById("status").innerText = "コピー完了！";
  } catch (e) {
    document.getElementById("status").innerText = "エラー：読み込めませんでした";
  }
}
</script>

</body>
</html>
